# RingFusion single-module calibration (bench: 1 camera + 1 LightRanger 14).
# Camera: Arducam B0179 (IMX219 1/4", 2.5 mm M12 fisheye, 170D x 155H x 115V).
#
# Deploy resolution: 1640x1232 -- the IMX219 full-sensor 2x2-binned mode, which
# keeps the FULL fisheye field (~155H x 115V) rather than the cropped 16:9 modes.
# CALIBRATED 2026-07-21 with tools/calibrate_camera.py (cv2.fisheye, RMS 0.5406 px).
# Intrinsics are resolution-specific -- this block is valid only at 1640x1232.
# Re-run the tool if the capture resolution or lens changes.
camera:
  width: 1640
  height: 1232
  model: fisheye              # fisheye (Kannala-Brandt) | pinhole
  fx: 584.5138
  fy: 584.4460
  cx: 823.6587
  cy: 582.5783
  dist: [0.043055, -0.016065, 0.008961, -0.001736]  # k1..k4 Kannala-Brandt

# Stage 1 rectification output: the rectilinear (pinhole) image the perception
# pipeline actually consumes, built from the fisheye calibration above. A fisheye
# model always produces a real de-warp (a zero-distortion fisheye is still an
# equidistant fisheye); real calibration just refines it. Same size as the capture
# keeps full detail before the backbone downscales to 384x288.
rectify:
  width: 1640
  height: 1232
  balance: 0.0        # 0 = crop to all-valid pixels, 1 = keep all source pixels
  fov_scale: 1.0      # >1 zooms in (narrower FOV, less extreme edge stretch)

tof:
  # Measured 2026-08-03 against TAPE ground truth -- seven markers spanning -43 to +48 deg
  # off axis, each at a hand-measured distance. Scored by direction lookup: for each marker
  # ask which zone points that way (invert zone_directions) and compare that zone's reading
  # to the tape. MAE 0.010 m at these values.
  #
  # The clearest single case is the marker on the red pole at +8.1 deg, tape 2.03 m: the
  # zone pointing that way reads 2.03 m.
  #
  # HOW WELL PINNED: anything in 66-82 deg scores ~1 cm, because the outer markers span
  # several ToF columns and neighbouring FOV values pick columns that read the same thing.
  # Above 84 deg is excluded (the -43 deg marker comes on-grid and reads badly). 73.5 sits
  # mid-band. Narrowing it further needs small targets at more distinct angles.
  #
  # fov_v CONFIRMED 2026-08-04 against tape, three independent ways. Previously this block
  # warned it was unverified -- every marker in the 2026-08-03 session sat within -10..+9 deg
  # vertically, so there was no leverage on the vertical angle. A second session fixed that
  # with eight markers spanning UP 35 to DOWN 9 deg:
  #   1. Five clean markers (0.33 - 3.03 m) read within 1-10 cm of tape, MAE 0.043 m.
  #   2. The floor implies a lens height of 15.97 cm against a 16.2 cm tape -- 2.3 mm.
  #   3. The cone edge is BRACKETED: the marker at 30.1 deg has a zone 0.24 deg away (inside),
  #      the one at 35.3 deg has none nearer than 5.0 deg (outside). Configured edge: 30.25.
  # Data: docs/demo/benchmarks/fov_v_session_2026-08-04.json
  #
  # The footprint is 567 x 443 px, 12.4% of the 1640x1232 frame.
  fov_h_deg: 73.5
  fov_v_deg: 60.5
  # cols/rows come from the live packet; these are defaults for offline tests.
  # The flashed focal-plane mode is 32x32 (CMD_LOAD_CFG_32X32), so cols is 32 -- the
  # old 48 was stale and only ever showed up in offline tests.
  cols: 32
  rows: 32

# Rigid transform: point in ToF frame -> point in camera frame.
# Camera optical convention: x right, y DOWN, z forward.
# Measured: lens center is 20.195 mm ABOVE the ToF center (so along -y from
# camera; equivalently the ToF sits +y below the camera), and the lens aperture
# is 1.13 mm FORWARD of the ToF (+z). Side offset assumed 0, rotation identity.
extrinsics_cam_tof:
  translation_mm: [0.0, 20.19497873, 1.13]   # [tx, ty, tz]
  rotation_rpy_deg: [0.0, 0.0, 0.0]
  # TODO after calibration: refine ty sign if zones land high/low, add tx if the
  # lens and ToF are not perfectly vertically aligned, add small tilt if needed.
